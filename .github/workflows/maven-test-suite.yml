# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  surefire-versions:
    # Builds the list of maven-surefire-plugin versions the integration tests in src/it run with, see Compatibility in
    # README.md: the older versions below plus maven.surefire.version from pom.xml, so a version bump in the pom is
    # tested without changing this workflow and the jobs are named after the real version.
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    env:
      OLDER_VERSIONS: '["3.0.0", "3.2.5", "3.5.3", "3.6.0"]'
    steps:
    - uses: actions/checkout@v7
    - id: versions
      run: |
        current=$(sed -n 's:.*<maven.surefire.version>\(.*\)</maven.surefire.version>.*:\1:p' pom.xml)
        test -n "$current" || { echo "maven.surefire.version not found in pom.xml"; exit 1; }
        echo "versions=$(jq -c --arg v "$current" '. + [$v] | unique' <<< "$OLDER_VERSIONS")" >> "$GITHUB_OUTPUT"

  build:
    # The JUnit 5 jobs keep the plain "surefire <version>" name so the existing check names don't change
    name: surefire ${{ matrix.surefire }}${{ matrix.junit == '6' && ' (JUnit 6)' || '' }}
    needs: surefire-versions

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        surefire: ${{ fromJSON(needs.surefire-versions.outputs.versions) }}
        # JUnit of the projects in src/it, the reporter itself is always built with JUnit 5 for Java 8.
        # JUnit 6 needs Java 17, see the junit6 profile in pom.xml.
        junit: ['5', '6']
        include:
        - junit: '5'
          java: '8'
          profile: ''
        - junit: '6'
          java: '17'
          profile: '-Pjunit6'

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B integration-test --file pom.xml -Dit.surefire.version=${{ matrix.surefire }} ${{ matrix.profile }}
    - name: Show the GitHub job summary
      # Runs the failure-summary sample project, which has failing tests on purpose (testFailureIgnore), with the
      # reporter just built, so githubStepSummary writes the tree of the failing classes to the summary of this job.
      env:
        MAVEN_OPTS: -Dfile.encoding=UTF-8
      run: |
        echo "## githubStepSummary sample, surefire ${{ matrix.surefire }}, JUnit ${{ matrix.junit }} (failing tests on purpose)" >> "$GITHUB_STEP_SUMMARY"
        mvn -B -f target/it/surefire-${{ matrix.surefire }}/failure-summary/pom.xml test \
          -Dmaven.repo.local="$PWD/target/local-repo" \
          -s "$PWD/target/it/surefire-${{ matrix.surefire }}/interpolated-settings.xml"

  dependency-graph:
    # The snapshot only matters for master, and the read-only token of Dependabot pull requests can't submit it (403)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 8
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
