# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Mantém as dependências do Maven (pom.xml) atualizadas
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    ignore:
      # O reporter compila e testa com JUnit 5 para continuar em Java 8. O JUnit 6 dos testes de integração
      # (it.junit6.version no pom.xml) continua sendo atualizado pelo junit-platform-launcher do maven-invoker-plugin
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]

  # Mantém os GitHub Actions atualizados (workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
